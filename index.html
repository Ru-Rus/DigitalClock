<!doctype html>
<html>
  <head>
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="clock-container">
      <div id="day-date"></div>
      <div id="clock"></div>
      <div id="t1"></div>
      <div id="t2"></div>
      <div id="t3"></div>
      <div id="location"></div>

      <button id="countdown-btn">Show Countdown</button>
      <div id="countdown"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
